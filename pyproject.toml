[project]
name = "whydunit"
version = "0.1.0"
description = "A forensic investigation console for AI pipeline failures"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
